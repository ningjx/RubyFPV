name: Ground station checks
on:
  push:
    branches: [refactor-radxa-ground-station]
  pull_request:
    branches: [refactor-radxa-ground-station]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: make -j4 check
      - run: python3 tests/unit/image_input.py
      - run: for script in image/*.sh; do bash -n "$script" || exit 1; done
